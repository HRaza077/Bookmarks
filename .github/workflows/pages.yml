name: Deploy Pages

# Publishes the repo as a static site. Custom domain (CNAME file):
# https://bookmarks.skillihire.com/   -> the dashboard (index.html)
# https://bookmarks.skillihire.com/privacy.html  -> privacy policy (used in the store listings)
# The old https://hraza077.github.io/Bookmarks/ URL redirects here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
