<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    width: 280px;
    padding: 14px;
    background: #ffffff;
    color: #0f172a;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1e293b; color: #e2e8f0; }
    .row { border-color: #334155 !important; }
    .btn-ghost { background: #0f172a !important; color: #cbd5e1 !important; border-color: #334155 !important; }
  }
  h1 { font-size: 0.95rem; display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .count {
    background: #2563eb; color: #fff; border-radius: 999px;
    font-size: 0.75rem; font-weight: 700; padding: 1px 8px; min-width: 20px; text-align: center;
  }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 2px; border-bottom: 1px solid #e2e8f0; font-size: 0.86rem;
  }
  .row:last-of-type { border-bottom: none; }
  .switch { position: relative; width: 38px; height: 22px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0; background: #cbd5e1; border-radius: 999px; transition: .15s; cursor: pointer;
  }
  .slider::before {
    content: ""; position: absolute; height: 16px; width: 16px; left: 3px; top: 3px;
    background: #fff; border-radius: 50%; transition: .15s;
  }
  input:checked + .slider { background: #2563eb; }
  input:checked + .slider::before { transform: translateX(16px); }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .btn {
    flex: 1; font: inherit; font-size: 0.82rem; font-weight: 600; cursor: pointer;
    border: 1px solid #2563eb; background: #2563eb; color: #fff;
    border-radius: 8px; padding: 8px; text-align: center;
  }
  .btn-ghost { background: #f8fafc; color: #334155; border-color: #e2e8f0; }
  .hint { font-size: 0.75rem; opacity: .7; margin-top: 10px; line-height: 1.4; }
  select {
    font: inherit; font-size: 0.8rem; padding: 3px 6px; border-radius: 6px;
    border: 1px solid #cbd5e1; background: transparent; color: inherit;
  }
</style>
</head>
<body>
  <h1>🔖 Bookmark Suggestions <span class="count" id="count">0</span></h1>

  <div class="row">
    <label for="enabled">Automatic suggestions</label>
    <span class="switch"><input type="checkbox" id="enabled"><span class="slider"></span></span>
  </div>
  <div class="row">
    <label for="pause">Pause for</label>
    <select id="pause">
      <option value="0">Not paused</option>
      <option value="3600000">1 hour</option>
      <option value="10800000">3 hours</option>
      <option value="86400000">Until tomorrow</option>
    </select>
  </div>

  <div class="actions">
    <button class="btn" id="open">Open dashboard</button>
    <button class="btn btn-ghost" id="clear">Clear dismissed</button>
  </div>

  <p class="hint" id="hint">All data stays in this browser. Manage everything from the dashboard's “Automatic Suggestions” settings.</p>

  <script src="popup.js"></script>
</body>
</html>
